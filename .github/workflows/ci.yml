name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

      - name: Run end-to-end example pipeline
        run: python examples/run_pipeline.py

      - name: Generate evaluation charts
        run: python scripts/generate_charts.py

      - name: Upload chart images
        uses: actions/upload-artifact@v4
        with:
          name: docs-images
          path: docs/images/

      - name: Upload sample memo output
        uses: actions/upload-artifact@v4
        with:
          name: sample-output
          path: examples/sample_output.md
